name: CD - Terraform Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g., commit SHA)'
        required: true
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  terraform_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_docker_image_tag: ${{ github.event.inputs.image_tag }}
        run: |
          terraform plan \
            -var="docker_image_tag=${{ github.event.inputs.image_tag }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_docker_image_tag: ${{ github.event.inputs.image_tag }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Get EC2 Public IP
        id: get-ip
        working-directory: ./terraform
        run: |
          PUBLIC_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "EC2_URL=http://$PUBLIC_IP:1337/admin" >> $GITHUB_ENV

      - name: Deployment Summary
        run: |
          echo "## 🚀 Terraform Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image Tag:** ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Public IP:** ${{ steps.get-ip.outputs.ec2_public_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strapi Admin URL:** http://${{ steps.get-ip.outputs.ec2_public_ip }}:1337/admin" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH Command:** \`ssh -i irfan-strapi-key.pem ec2-user@${{ steps.get-ip.outputs.ec2_public_ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. SSH into EC2: \`ssh -i irfan-strapi-key.pem ec2-user@${{ steps.get-ip.outputs.ec2_public_ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Check container status: \`docker ps\`" >> $GITHUB_STEP_SUMMARY
          echo "3. View logs: \`docker logs -f strapi\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Access Strapi: http://${{ steps.get-ip.outputs.ec2_public_ip }}:1337/admin" >> $GITHUB_STEP_SUMMARY
