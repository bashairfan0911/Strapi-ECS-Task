name: CI - Build & Push Strapi Image to ECR

on:
  push:
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "config/**"
      - "package.json"
    branches: 
      - ECR-cicd

permissions:
  contents: read
  id-token: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: "irfan-strapi-image"
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Building Docker image for branch: $BRANCH_NAME..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Tag with branch name for ECR-cicd
          if [ "$BRANCH_NAME" = "ECR-cicd" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       $ECR_REGISTRY/$ECR_REPOSITORY:ecr-cicd
          fi

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          if [ "$BRANCH_NAME" = "ECR-cicd" ]; then
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:ecr-cicd
          fi

      - name: Set output image tag
        id: ci-output
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create deployment summary
        run: |
          echo "## 🚀 ECR Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** irfan-strapi-image" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** latest, ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ steps.ecr-login.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_name }}" = "ECR-cicd" ]; then
            echo "- **ECR-CICD Tag:** ecr-cicd" >> $GITHUB_STEP_SUMMARY
          fi

