name: Manual Deployment & Rollback

on:
  push:
    branches:
      - Task-11
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - rollback
          - status
      image_tag:
        description: 'Image tag to deploy (for deploy action, leave empty for latest)'
        required: false
        type: string
      deployment_id:
        description: 'Deployment ID (for rollback/status action)'
        required: false
        type: string

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: strapi-app
  ECS_CLUSTER: strapi-ecs-irfan-cluster
  ECS_SERVICE: strapi-service
  TASK_DEFINITION_FAMILY: strapi-task
  CONTAINER_NAME: strapi
  CODEDEPLOY_APPLICATION: strapi-ecs-app-irfan
  CODEDEPLOY_DEPLOYMENT_GROUP: strapi-deployment-group-irfan

jobs:
  manual-deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'deploy'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tag
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            IMAGE_TAG="latest"
          else
            IMAGE_TAG="$INPUT_TAG"
          fi
          
          FULL_IMAGE="$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
          echo "image=$FULL_IMAGE" >> $GITHUB_OUTPUT
          echo "📦 Using image: $FULL_IMAGE"

      - name: Get and update task definition
        id: task-def
        env:
          NEW_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json > current-task-def.json
          
          # Clean and update
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            current-task-def.json | \
          jq --arg IMAGE "$NEW_IMAGE" '.containerDefinitions[0].image = $IMAGE' > updated-task-def.json
          
          # Register new task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "✅ Task definition: $TASK_DEF_ARN"

      - name: Deploy via CodeDeploy
        id: deploy
        env:
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_def_arn }}
        run: |
          # Create AppSpec
          cat > appspec.json << EOF
          {
            "version": 0.0,
            "Resources": [
              {
                "TargetService": {
                  "Type": "AWS::ECS::Service",
                  "Properties": {
                    "TaskDefinition": "$TASK_DEF_ARN",
                    "LoadBalancerInfo": {
                      "ContainerName": "${{ env.CONTAINER_NAME }}",
                      "ContainerPort": 1337
                    },
                    "PlatformVersion": "1.4.0"
                  }
                }
              }
            ]
          }
          EOF
          
          # Trigger deployment
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APPLICATION }} \
            --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --revision revisionType=AppSpecContent,appSpecContent={content="$(cat appspec.json | jq -c .)"} \
            --description "Manual deployment - Image: ${{ steps.image.outputs.image }}" \
            --query 'deploymentId' \
            --output text)
          
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "🚀 Deployment ID: $DEPLOYMENT_ID"
          
          echo "## Manual Deployment Started" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: \`$DEPLOYMENT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.image.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- [View in Console](https://console.aws.amazon.com/codesuite/codedeploy/deployments/$DEPLOYMENT_ID?region=${{ env.AWS_REGION }})" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop and rollback deployment
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "❌ Deployment ID is required for rollback"
            exit 1
          fi
          
          echo "🔙 Stopping deployment: $DEPLOYMENT_ID"
          
          aws deploy stop-deployment \
            --deployment-id $DEPLOYMENT_ID \
            --auto-rollback-enabled
          
          echo "✅ Rollback initiated"
          
          echo "## Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: \`$DEPLOYMENT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-rollback has been triggered" >> $GITHUB_STEP_SUMMARY

  check-status:
    name: Check Deployment Status
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'status'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get deployment status
        env:
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
        run: |
          if [ -n "$DEPLOYMENT_ID" ]; then
            # Get specific deployment status
            echo "📋 Deployment Status for: $DEPLOYMENT_ID"
            aws deploy get-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --query 'deploymentInfo.{Status:status,StartTime:createTime,EndTime:completeTime,Description:description,ErrorInfo:errorInformation}' \
              --output table
          else
            # Get recent deployments
            echo "📋 Recent Deployments:"
            aws deploy list-deployments \
              --application-name ${{ env.CODEDEPLOY_APPLICATION }} \
              --deployment-group-name ${{ env.CODEDEPLOY_DEPLOYMENT_GROUP }} \
              --max-items 5 \
              --query 'deployments' \
              --output json | jq -r '.[]' | while read id; do
                aws deploy get-deployment \
                  --deployment-id $id \
                  --query 'deploymentInfo.{ID:deploymentId,Status:status,Created:createTime}' \
                  --output table
              done
          fi

      - name: Get ECS service status
        run: |
          echo ""
          echo "📋 ECS Service Status:"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{DesiredCount:desiredCount,RunningCount:runningCount,PendingCount:pendingCount,Status:status,TaskDefinition:taskDefinition}' \
            --output table
